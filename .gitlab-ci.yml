stages:
  - deploy

# Deploy on ux-* prototype branches (same pattern as gitlab-ha / gitlab-filter)
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^ux-/'

pages:
  stage: deploy
  tags:
    - itup-alm-x86
  script:
    - echo "Publishing pre-built static files from public/"
    - test -f public/index.html
    - test -f public/404.html
  artifacts:
    paths:
      - public/
